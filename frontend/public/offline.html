<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PPOINNT - Offline</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #0A0B0D;
      color: #E5E5E7;
      font-family: 'Manrope', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }
    .container {
      max-width: 430px;
      width: 100%;
      text-align: center;
      padding: 32px 24px;
      border-radius: 24px;
      background: #1A1B1E;
      border: 1px solid #2E2E32;
    }
    .icon {
      font-size: 64px;
      margin-bottom: 24px;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    h1 {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 12px;
      color: #FFC72C;
    }
    p {
      font-size: 14px;
      color: #A1A1A6;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .features {
      text-align: left;
      background: #0A0B0D;
      padding: 16px;
      border-radius: 12px;
      margin-bottom: 24px;
    }
    .feature {
      font-size: 13px;
      padding: 8px 0;
      color: #A1A1A6;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .feature::before {
      content: '✓';
      color: #23C57A;
      font-weight: bold;
      flex-shrink: 0;
    }
    button {
      width: 100%;
      padding: 16px;
      background: #FFC72C;
      color: #0A0B0D;
      border: none;
      border-radius: 12px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:active {
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📡</div>
    <h1>You're Offline</h1>
    <p>PPOINNT is loading your cached data. Some features may be limited.</p>

    <div class="features">
      <div class="feature">View saved addresses</div>
      <div class="feature">Search cached locations</div>
      <div class="feature">Access your profile</div>
    </div>

    <button onclick="location.reload()">Try Again</button>
  </div>
</body>
</html>
